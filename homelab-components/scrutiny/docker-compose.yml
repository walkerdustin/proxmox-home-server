# Hub only — deploy in LXC 102 at /opt/scrutiny
# InfluxDB stays on the compose network (not published to LAN).

services:
  influxdb:
    image: influxdb:2.8
    container_name: scrutiny-influxdb
    restart: unless-stopped
    volumes:
      - ./influxdb:/var/lib/influxdb2
    networks:
      - scrutiny-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  scrutiny-web:
    image: ghcr.io/analogj/scrutiny:v0.9.3-web
    container_name: scrutiny-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/opt/scrutiny/config
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - scrutiny-net

networks:
  scrutiny-net:
    driver: bridge
