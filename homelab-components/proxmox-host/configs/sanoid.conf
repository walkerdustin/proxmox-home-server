# /etc/sanoid/sanoid.conf  —  Proxmox host `pve`
#
# Local ZFS snapshots for VM 101 (seafile). Protects against deleted libraries,
# bad rm, ransomware and failed upgrades. Does NOT protect against pool loss or
# site loss — Kopia -> friend's TrueNAS is still required for that.
#
# The Debian package ships NO default config; this file must exist or sanoid
# aborts with "cannot load /etc/sanoid/sanoid.conf".
# Do not edit /usr/share/sanoid/sanoid.defaults.conf; override here only.
#
# Indentation is deliberately omitted — INI keys need none, and stray tabs get
# mangled when pasting into an interactive shell.
#
# Timing: the guest dumps its three MariaDB databases to
# /mnt/data/seafile/backup-sql/ at 03:15 (seafile-backup-sql.timer). The daily
# snapshot of the data zvol is taken at 04:00, so every daily snapshot holds the
# block store AND a fresh SQL dump = one self-consistent restore set.
#
# Space: tank/vm-101-disk-0 is thick-provisioned (refreservation 2.98T of ~3.53T
# usable), so snapshot divergence has limited headroom. Retention is deliberately
# conservative. Watch:
#   zfs list -o name,used,avail,refer,usedbysnapshots tank tank/vm-101-disk-0
#
# Note: sanoid only prunes snapshots matching its own autosnap naming, so manual
# and Proxmox (`qm snapshot`) snapshots are never touched by autoprune.

# ---- Seafile data disk (blocks + SQL dumps), scsi1 on tank ----
[tank/vm-101-disk-0]
use_template = seafiledata
recursive = no

# ---- VM 101 OS disk (also holds the live MariaDB), scsi0 on rpool ----
[rpool/data/vm-101-disk-1]
use_template = vmos
recursive = no

# ---------------------------------------------------------------------------

# Append-mostly workload: Seafile blocks are content-addressed and immutable, so
# hourly snapshots cost almost nothing until a GC actually deletes blocks.
[template_seafiledata]
frequently = 0
hourly = 12
daily = 7
weekly = 2
monthly = 0
yearly = 0
autosnap = yes
autoprune = yes
daily_hour = 4
daily_min = 0

# Small disk (~6.5G). A crash-consistent snapshot of the live MariaDB is a bonus
# only — the authoritative DB backup is the logical dump on tank.
[template_vmos]
frequently = 0
hourly = 0
daily = 7
weekly = 0
monthly = 0
yearly = 0
autosnap = yes
autoprune = yes
daily_hour = 4
daily_min = 10
